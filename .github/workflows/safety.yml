name: Safety
permissions: {}

on:
  pull_request:
  push:

jobs:
  safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig toolchain
        run: ./zig/download.sh

      - name: Enforce internal panic prefix
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path("src/libtigercheck/analysis")
          bad = []
          panic_re = re.compile(r'std\.debug\.panic\("([^"]+)"')
          for path in root.rglob("*.zig"):
            text = path.read_text(encoding="utf-8")
            for m in panic_re.finditer(text):
              msg = m.group(1)
              if not msg.startswith("internal invariant violated:"):
                bad.append(f"{path}: {msg}")

          if bad:
            print("panic prefix check failed:")
            for line in bad:
              print(f"- {line}")
            sys.exit(1)
          PY

      - name: Build and test
        run: ./zig/zig build test

      - name: Precision check
        run: ./zig/zig build precision-check

      - name: Strict conformance
        run: ./zig/zig build check-strict -Dstyle-path=./src/libtigercheck

      - name: Upload precision report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precision-current
          path: zig-out/precision-current.json
          if-no-files-found: ignore
