name: Safety
permissions: {}

on:
  pull_request:
  push:

jobs:
  safety:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zig toolchain
        run: ./zig/download.sh

      - name: Build and test
        run: ./zig/zig build test

      - name: Precision check
        run: ./zig/zig build precision-check

      - name: Strict conformance
        run: ./zig/zig build run -- --gates policy,perf ./src/libtigercheck

      - name: Pedantic source scan
        run: ./zig/zig build --release=fast run -- ./src

      - name: Upload precision report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precision-current
          path: zig-out/precision-current.json
          if-no-files-found: ignore
