name: "Release (validate)"
permissions: {}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate (x.y.z)"
        required: true
        type: string
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

  schedule:
    - cron: 0 */6 * * *

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - run: ./zig/download.sh
      - run: ./zig/zig build release-validate -- --tag "${{ github.event.inputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
