name: "Release (validate)"
permissions: {}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate (x.y.z)"
        required: true
        type: string
      sha:
        description: "Release source commit SHA"
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - run: ./zig/download.sh
      - run: ./zig/zig build release-validate -- --tag "${{ github.event.inputs.tag }}" --sha "${{ github.event.inputs.sha }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
