name: "Release (validate)"
permissions: {}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional tag to validate (x.y.z). Defaults to latest release"
        required: false
        type: string
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

  schedule:
    - cron: 0 */6 * * *

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ !(github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - run: ./zig/download.sh
      - name: Validate latest release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.tag == '' }}
        run: ./zig/zig build release-validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate selected release tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        run: ./zig/zig build release-validate -- --tag "${{ inputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
